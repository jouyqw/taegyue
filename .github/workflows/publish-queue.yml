name: 예약 칼럼 발행

# 매일 칼럼을 쓰던 클라우드 예약 세션이 조용히 실패하는 날이 많아 8/15 이후 발행이 끊겼다.
# 세션은 매일 실행됐지만 커밋이 들어오지 않았다. 그래서 "글 쓰기"와 "글 내보내기"를 나눈다.
#   글쓰기 : content/queue/<slug>.json 에 publishAt 을 박아 미리 채워 둔다.
#   발행   : 이 워크플로가 매일 한 편씩 렌더링해 커밋한다. LLM 이 끼지 않는다.

on:
  schedule:
    - cron: "10 15 * * *" # 매일 00:10 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 발행일 도래분 렌더링
        id: promote
        run: node scripts/publish-queue.mjs

      - name: 전체 빌드
        if: steps.promote.outputs.published != '0'
        run: node scripts/build-all.mjs

      - name: 품질 검증
        if: steps.promote.outputs.published != '0'
        run: node scripts/validate-content-quality.mjs

      - name: 커밋
        if: steps.promote.outputs.published != '0'
        run: |
          if git diff --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "publish-bot"
          git config user.email "bot@auto.local"
          git add -A
          git commit -m "전주개인회생 칼럼 발행: ${{ steps.promote.outputs.summary }}"
          git push

      - name: 큐 잔량 알림
        run: |
          left=$(ls content/queue/*.json 2>/dev/null | wc -l)
          echo "### 큐 잔량: ${left}편" >> $GITHUB_STEP_SUMMARY
          if [ "$left" -lt 7 ]; then
            echo "큐가 7편 미만입니다. 채워 두세요." >> $GITHUB_STEP_SUMMARY
          fi
          # 큐가 비면 내일부터 발행이 멈춘다. 요약에만 남기면 아무도 보지 않으므로
          # 워크플로를 실패시켜 GitHub 이 알림 메일을 보내게 한다.
          if [ "$left" -eq 0 ]; then
            echo "::error::큐가 비었습니다. 내일부터 발행이 멈춥니다. content/queue 를 채우세요."
            exit 1
          fi
